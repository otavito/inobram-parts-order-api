name: Deploy Function App without external actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: inobram-spare-parts

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository manually
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} repo
          cd repo
          git checkout ${{ github.sha }}

      - name: Install dependencies
        run: |
          cd repo
          node --version
          npm --version
          npm ci --omit=dev

      - name: Create deployment zip
        run: |
          cd repo
          zip -r ../release.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "local.settings.json" \
            -x ".env"

      - name: Deploy zip to Azure Function App
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          echo "$PUBLISH_PROFILE" > publishProfile.xml

          USERNAME=$(grep -o 'userName="[^"]*"' publishProfile.xml | head -1 | sed 's/userName="//;s/"//')
          PASSWORD=$(grep -o 'userPWD="[^"]*"' publishProfile.xml | head -1 | sed 's/userPWD="//;s/"//')
          PUBLISH_URL=$(grep -o 'publishUrl="[^"]*"' publishProfile.xml | head -1 | sed 's/publishUrl="//;s/"//')

          SCM_HOST=$(echo "$PUBLISH_URL" | sed 's/:443//')
          DEPLOY_URL="https://${SCM_HOST}/api/zipdeploy"

          echo "Deploying to $DEPLOY_URL"

          curl -X POST "$DEPLOY_URL" \
            -u "$USERNAME:$PASSWORD" \
            --data-binary "@release.zip" \
            -H "Content-Type: application/zip"
